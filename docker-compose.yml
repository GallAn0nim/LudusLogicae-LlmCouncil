services:
  db:
    image: postgres:19-alpine
    container_name: luduslogicae-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ludus_logicae}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/LudusLogicae.Api/Dockerfile
    container_name: luduslogicae-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-ludus_logicae};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Database__AutoMigrate: ${DB_AUTO_MIGRATE:-true}
      Database__MigrationRetrySeconds: ${DB_MIGRATION_RETRY_SECONDS:-60}
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      OpenAI__BaseUrl: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OpenAI__OrganizationId: ${OPENAI_ORG_ID:-}
      OpenAI__TimeoutSeconds: ${OPENAI_TIMEOUT_SECONDS:-60}
      OpenAI__MaxRetries: ${OPENAI_MAX_RETRIES:-3}
      OpenAI__RetryBaseDelayMs: ${OPENAI_RETRY_BASE_DELAY_MS:-250}
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      Llm__DefaultProvider: ${LLM_DEFAULT_PROVIDER:-Anthropic}
      Llm__Providers__0__Name: OpenAI
      Llm__Providers__0__SupportedModels__0: gpt-4.1
      Llm__Providers__0__SupportedModels__1: gpt-4.1-mini
      Llm__Providers__0__SupportedModels__2: gpt-4.1-nano
      Llm__Providers__0__SupportedModels__3: gpt-5
      Llm__Providers__0__SupportedModels__4: gpt-5-mini
      Llm__Providers__0__SupportedModels__5: gpt-5-nano
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_HTTP_PORT:-8080}:8080"
      - "${API_HTTPS_PORT:-8443}:8443"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: luduslogicae-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api
    environment:
      - NODE_ENV=production

volumes:
  db_data:
